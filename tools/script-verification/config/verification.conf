# 공용 검증의 권위 있는 설정입니다. POSIX sh에서 source할 수 있는 값만 둡니다.
SHELLCHECK_VERSION=0.11.0
SHELLCHECK_OPTIONS='--shell=sh --external-sources --source-path=SCRIPTDIR --severity=style'
SHFMT_VERSION=3.13.1
SHFMT_OPTIONS='-d'
VERIFICATION_SCRIPT_TARGETS="$VERIFICATION_GITHOOKS_ROOT tools/ci tools/repository-paths tools/script-tests"
VERIFICATION_EXCLUDES=''
SHELLCHECK_SUPPRESSIONS=''
