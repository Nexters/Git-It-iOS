name: Issue Workflow

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/issue-workflow.yml
      - .tools/issue-workflow/**
      - docs/conventions/workflow/**

# 라벨을 달고 떼는 중에 취소되지 않도록 같은 PR의 run은 줄을 세웁니다.
concurrency:
  group: issue-workflow-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  live-flow:
    name: live flow
    # 같은 저장소의 issue 브랜치만 실제 gh로 잽니다.
    if: ${{ vars.GIT_IT_CI_VALIDATION_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/') }}
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Measure issue workflow commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.tools/issue-workflow/bin/measure-flow.sh --branch "$GITHUB_HEAD_REF" --label-probe --summary "$GITHUB_STEP_SUMMARY"
