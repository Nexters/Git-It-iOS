name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - release/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GIT_IT_TEST_DESTINATION: platform=iOS Simulator,OS=26.0,name=iPhone 17

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Load repository paths
        run: ./tools/repository-paths/bin/repository-paths.sh >> "$GITHUB_ENV"

      - name: Install Tuist
        uses: jdx/mise-action@v3
        with:
          mise_toml: |
            [tools]
            tuist = "4.202.2"

      - name: Verify toolchain
        run: |
          xcodebuild -version
          tuist version

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.tuist/Cache
            ${{ env.GIT_IT_TUIST_ROOT }}/.build
            .build
            ${{ env.GIT_IT_SWIFT_STYLE_ROOT }}/.build
          key: ${{ runner.os }}-dependencies-${{ hashFiles(env.GIT_IT_PATHS_FILE, format('{0}/Package.resolved', env.GIT_IT_TUIST_ROOT), format('{0}/Package.swift', env.GIT_IT_TUIST_ROOT), format('{0}/Workspace.swift', env.GIT_IT_IOS_ROOT), format('{0}/*/Project.swift', env.GIT_IT_PROJECTS_ROOT), format('{0}/ProjectDescriptionHelpers/**/*.swift', env.GIT_IT_TUIST_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-dependencies-

      - name: Install dependencies
        run: tuist install
        working-directory: ${{ env.GIT_IT_IOS_ROOT }}

      - name: Generate workspace
        run: tuist generate --no-open
        working-directory: ${{ env.GIT_IT_IOS_ROOT }}

      - name: Lint Swift style
        run: |
          "$GIT_IT_SWIFT_FORMAT_RUNNER" lint

      - name: Build shared schemes
        run: |
          "$GIT_IT_PROJECT_BUILD_RUNNER" build

      - name: Compile tests
        run: |
          "$GIT_IT_PROJECT_BUILD_RUNNER" compile

      - name: Run tests
        run: |
          "$GIT_IT_PROJECT_BUILD_RUNNER" test
