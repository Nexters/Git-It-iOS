name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - release/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      scripts_changed: ${{ steps.classify.outputs.scripts_changed }}
      swift_changed: ${{ steps.classify.outputs.swift_changed }}
      ui_changed: ${{ steps.classify.outputs.ui_changed }}
      project_config_changed: ${{ steps.classify.outputs.project_config_changed }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      tests_changed: ${{ steps.classify.outputs.tests_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        run: ./tools/ci/bin/classify-changes.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  script-quality:
    name: script quality
    needs: changes
    # Repository variable를 true로 바꾸기 전에는 검증 job을 실행하지 않습니다.
    if: ${{ vars.GIT_IT_CI_VALIDATION_ENABLED == 'true' && (needs.changes.outputs.scripts_changed == 'true' || needs.changes.outputs.workflow_changed == 'true') }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Load repository paths
        run: ./tools/repository-paths/bin/repository-paths.sh >> "$GITHUB_ENV"

      - name: Install script test dependency
        run: brew install ripgrep

      - name: Run script tests
        run: "$GIT_IT_SCRIPT_TEST_RUNNER"

      - name: Cache script verification tools
        id: script-tools-cache
        uses: actions/cache@v4
        with:
          path: tools/script-verification/.build
          key: ${{ runner.os }}-${{ runner.arch }}-script-tools-${{ hashFiles('tools/script-verification/dependencies/tools.lock') }}

      - name: Prepare script verification tools
        if: ${{ steps.script-tools-cache.outputs.cache-hit != 'true' }}
        run: |
          verification_prepare=${GIT_IT_SCRIPT_VERIFICATION_RUNNER%/run.sh}/prepare-tools.sh
          "$verification_prepare"

      - name: Verify project scripts
        run: "$GIT_IT_SCRIPT_VERIFICATION_RUNNER"

  swift-lint:
    name: lint
    needs: changes
    if: ${{ vars.GIT_IT_CI_VALIDATION_ENABLED == 'true' && needs.changes.outputs.swift_changed == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Load repository paths
        run: ./tools/repository-paths/bin/repository-paths.sh >> "$GITHUB_ENV"

      - name: Cache Swift style dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.GIT_IT_SWIFT_STYLE_ROOT }}/.build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-style-v1-${{ hashFiles(env.GIT_IT_PATHS_FILE, format('{0}/Package.resolved', env.GIT_IT_SWIFT_STYLE_ROOT), format('{0}/Package.swift', env.GIT_IT_SWIFT_STYLE_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-style-v1-

      - name: Lint Swift style
        run: |
          ./tools/ci/bin/lint-changed-swift.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  build:
    name: build
    needs: changes
    if: ${{ vars.GIT_IT_CI_VALIDATION_ENABLED == 'true' && (needs.changes.outputs.swift_changed == 'true' || needs.changes.outputs.tests_changed == 'true' || needs.changes.outputs.project_config_changed == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Load repository paths
        run: ./tools/repository-paths/bin/repository-paths.sh >> "$GITHUB_ENV"

      - name: Install Tuist
        uses: jdx/mise-action@v3
        with:
          mise_toml: |
            [tools]
            tuist = "4.202.2"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tuist
            ${{ env.GIT_IT_TUIST_ROOT }}/.build
            .build
            ${{ env.GIT_IT_SWIFT_STYLE_ROOT }}/.build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-tuist-4.202.2-dependencies-${{ hashFiles(env.GIT_IT_PATHS_FILE, format('{0}/Package.resolved', env.GIT_IT_TUIST_ROOT), format('{0}/Package.swift', env.GIT_IT_TUIST_ROOT), format('{0}/Workspace.swift', env.GIT_IT_IOS_ROOT), format('{0}/*/Project.swift', env.GIT_IT_PROJECTS_ROOT), format('{0}/ProjectDescriptionHelpers/**/*.swift', env.GIT_IT_TUIST_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-tuist-4.202.2-dependencies-

      - name: Ensure app xcconfigs
        run: |
          "$GIT_IT_PROJECT_SETUP_RUNNER" ensure-app-xcconfigs

      - name: Install dependencies
        run: tuist install
        working-directory: ${{ env.GIT_IT_IOS_ROOT }}

      - name: Generate workspace
        run: tuist generate --no-open
        working-directory: ${{ env.GIT_IT_IOS_ROOT }}

      - name: Build all shared schemes
        if: ${{ needs.changes.outputs.project_config_changed == 'true' }}
        run: |
          "$GIT_IT_PROJECT_BUILD_RUNNER" build

  compile:
    name: compile
    needs:
      - changes
      - build
    if: ${{ vars.GIT_IT_CI_VALIDATION_ENABLED == 'true' && (needs.changes.outputs.swift_changed == 'true' || needs.changes.outputs.tests_changed == 'true' || needs.changes.outputs.project_config_changed == 'true') }}
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      testable_schemes: ${{ steps.discover.outputs.schemes }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GIT_IT_TEST_DESTINATION: platform=iOS Simulator,OS=latest,name=iPhone 17
      GIT_IT_XCODE_JOBS: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Load repository paths
        run: ./tools/repository-paths/bin/repository-paths.sh >> "$GITHUB_ENV"

      - name: Install Tuist
        uses: jdx/mise-action@v3
        with:
          mise_toml: |
            [tools]
            tuist = "4.202.2"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tuist
            ${{ env.GIT_IT_TUIST_ROOT }}/.build
            .build
            ${{ env.GIT_IT_SWIFT_STYLE_ROOT }}/.build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-tuist-4.202.2-dependencies-${{ hashFiles(env.GIT_IT_PATHS_FILE, format('{0}/Package.resolved', env.GIT_IT_TUIST_ROOT), format('{0}/Package.swift', env.GIT_IT_TUIST_ROOT), format('{0}/Workspace.swift', env.GIT_IT_IOS_ROOT), format('{0}/*/Project.swift', env.GIT_IT_PROJECTS_ROOT), format('{0}/ProjectDescriptionHelpers/**/*.swift', env.GIT_IT_TUIST_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-tuist-4.202.2-dependencies-

      - name: Ensure app xcconfigs
        run: |
          "$GIT_IT_PROJECT_SETUP_RUNNER" ensure-app-xcconfigs

      - name: Install dependencies
        run: tuist install
        working-directory: ${{ env.GIT_IT_IOS_ROOT }}

      - name: Generate workspace
        run: tuist generate --no-open
        working-directory: ${{ env.GIT_IT_IOS_ROOT }}

      # xcscheme은 tuist generate가 만든 .xcodeproj 안에만 존재하고 .xcodeproj는
      # gitignore 대상이라, workspace를 생성한 이 job에서 test job의 matrix로 쓸
      # scheme 목록을 찾습니다.
      - name: Discover testable schemes
        id: discover
        run: |
          schemes=$(
            find "$GIT_IT_PROJECTS_ROOT" -path '*/xcshareddata/xcschemes/*.xcscheme' \
              -exec sh -c 'grep -q "<TestableReference" "$1" && basename "$1" .xcscheme' _ {} \; \
              | sort -u
          )
          printf '%s\n' "$schemes" | jq -R -s -c 'split("\n") | map(select(length > 0))' \
            | { read -r json; echo "schemes=$json" >> "$GITHUB_OUTPUT"; }

      # 패키지별 test target을 각자 격리된 DerivedData(TestSchemes/<scheme>)로 빌드합니다.
      - name: Compile package test targets
        run: |
          "$GIT_IT_PROJECT_BUILD_RUNNER" compile

      # test job이 패키지별로 병렬 실행되며 재사용할 수 있도록 빌드 산출물을 넘깁니다.
      - name: Upload package test builds
        uses: actions/upload-artifact@v4
        with:
          name: test-derived-data
          path: ${{ env.GIT_IT_DERIVED_DATA_PATH }}/TestSchemes
          retention-days: 1
          if-no-files-found: error

  test:
    name: test
    needs:
      - changes
      - compile
    if: ${{ vars.GIT_IT_CI_VALIDATION_ENABLED == 'true' && (needs.changes.outputs.swift_changed == 'true' || needs.changes.outputs.tests_changed == 'true' || needs.changes.outputs.project_config_changed == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheme: ${{ fromJson(needs.compile.outputs.testable_schemes) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GIT_IT_TEST_DESTINATION: platform=iOS Simulator,OS=latest,name=iPhone 17
      GIT_IT_XCODE_JOBS: 4
      GIT_IT_ONLY_SCHEME: ${{ matrix.scheme }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Load repository paths
        run: ./tools/repository-paths/bin/repository-paths.sh >> "$GITHUB_ENV"

      - name: Install Tuist
        uses: jdx/mise-action@v3
        with:
          mise_toml: |
            [tools]
            tuist = "4.202.2"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tuist
            ${{ env.GIT_IT_TUIST_ROOT }}/.build
            .build
            ${{ env.GIT_IT_SWIFT_STYLE_ROOT }}/.build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-tuist-4.202.2-dependencies-${{ hashFiles(env.GIT_IT_PATHS_FILE, format('{0}/Package.resolved', env.GIT_IT_TUIST_ROOT), format('{0}/Package.swift', env.GIT_IT_TUIST_ROOT), format('{0}/Workspace.swift', env.GIT_IT_IOS_ROOT), format('{0}/*/Project.swift', env.GIT_IT_PROJECTS_ROOT), format('{0}/ProjectDescriptionHelpers/**/*.swift', env.GIT_IT_TUIST_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-tuist-4.202.2-dependencies-

      - name: Ensure app xcconfigs
        run: |
          "$GIT_IT_PROJECT_SETUP_RUNNER" ensure-app-xcconfigs

      - name: Install dependencies
        run: tuist install
        working-directory: ${{ env.GIT_IT_IOS_ROOT }}

      - name: Generate workspace
        run: tuist generate --no-open
        working-directory: ${{ env.GIT_IT_IOS_ROOT }}

      - name: Download package test builds
        uses: actions/download-artifact@v4
        with:
          name: test-derived-data
          path: ${{ env.GIT_IT_DERIVED_DATA_PATH }}/TestSchemes

      # GIT_IT_ONLY_SCHEME이 matrix가 맡은 패키지 scheme 하나로만 실행 범위를 좁힙니다.
      - name: Run package tests without rebuilding
        run: |
          "$GIT_IT_PROJECT_BUILD_RUNNER" test

  gate:
    name: CI / gate
    needs:
      - changes
      - script-quality
      - swift-lint
      - build
      - compile
      - test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Evaluate gate
        run: |
          ./tools/ci/bin/gate-evaluate.sh \
            "${{ needs.changes.result }}" \
            "${{ needs.script-quality.result }}" \
            "${{ needs.swift-lint.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.compile.result }}" \
            "${{ needs.test.result }}"
