schema_version: "1.0"

extension:
  id: swift-format
  name: "Git-It Swift Format"
  version: "2.0.0"
  description: "현재 작업 트리에서 변경된 Swift 파일을 프로젝트 공개 포맷 명령으로 정리합니다."
  author: Git-It
  license: MIT

requires:
  speckit_version: ">=0.14.1"

provides:
  commands:
    - name: speckit.swift-format.run
      file: commands/speckit.swift-format.md
      description: "현재 작업 트리에서 추가 또는 수정된 Swift 파일을 포맷합니다."

hooks:
  after_implement:
    command: speckit.swift-format.run
    optional: false
    priority: 10
    prompt: "현재 변경된 Swift 파일을 포맷할까요?"
    description: "모든 구현 패키지 완료 후 현재 변경된 Swift 파일을 포맷합니다."

tags:
  - swift
  - format
  - validation
